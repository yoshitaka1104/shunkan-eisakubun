<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>音声チェック</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <style>
      .check {
        gap: 16px;
      }

      .check h1 {
        font-size: 1.4rem;
      }

      .check h2 {
        font-size: 1.1rem;
      }

      .answers {
        display: flex;
        gap: 8px;
      }

      .answers > button {
        flex: 1;
        min-width: 0;
      }

      .results {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }

      .results th {
        padding: 6px 4px 6px 0;
        font-weight: 600;
        text-align: left;
      }

      .results td {
        padding: 6px 2px;
        text-align: right;
        white-space: nowrap;
      }

      .results tr + tr th,
      .results tr + tr td {
        border-top: 1px solid var(--line);
      }

      .results .heard {
        color: var(--good);
        font-weight: 700;
      }

      .results .silent {
        color: var(--bad);
        font-weight: 700;
      }

      .report {
        color: var(--muted);
        font-size: 0.75rem;
        overflow-wrap: anywhere;
        user-select: text;
        -webkit-user-select: text;
      }
    </style>
    <script type="module" src="js/sound-check.js"></script>
  </head>
  <body>
    <main class="screen check">
      <h1>音声チェック</h1>
      <p id="intro">どの条件なら音が出るかを、この端末で確かめます。1〜2分で終わります。消音モードを解除し、音量を上げてから始めてください。</p>
      <h2 id="step" hidden></h2>
      <p id="hint" hidden></p>
      <button type="button" class="primary" id="play">始める</button>
      <div class="answers" id="answers" hidden>
        <button type="button" class="secondary" id="heard">聞こえた</button>
        <button type="button" class="secondary" id="silent">聞こえない</button>
      </div>
      <table class="results" id="results"></table>
      <p class="report" id="report" hidden></p>
      <button type="button" class="secondary" id="copy" hidden>結果をコピー</button>
      <a class="text-button" href="index.html">アプリへ戻る</a>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
