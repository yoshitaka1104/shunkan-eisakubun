<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>マイク診断</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <style>
      .diagnosis {
        gap: 16px;
      }

      .diagnosis h1 {
        font-size: 1.4rem;
      }

      .steps {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-left: 1.4em;
      }

      .cue {
        display: grid;
        place-items: center;
        min-height: 112px;
        padding: 12px;
        border-radius: var(--radius);
        background: var(--line);
        font-size: 1.3rem;
        font-weight: 700;
        text-align: center;
      }

      .cue[data-kind="talk"] {
        background: var(--good-soft);
        color: var(--good);
      }

      .cue[data-kind="quiet"] {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .results {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
        font-variant-numeric: tabular-nums;
      }

      .results th {
        padding: 6px 4px 6px 0;
        font-weight: 600;
        text-align: left;
      }

      .results td {
        padding: 6px 2px;
        text-align: center;
        white-space: nowrap;
      }

      .results tr + tr th,
      .results tr + tr td {
        border-top: 1px solid var(--line);
      }

      .results .heard {
        color: var(--good);
        font-weight: 700;
      }

      .results .deaf {
        color: var(--bad);
        font-weight: 700;
      }

      .report {
        color: var(--muted);
        font-size: 0.75rem;
        overflow-wrap: anywhere;
        user-select: text;
        -webkit-user-select: text;
      }
    </style>
    <script type="module" src="js/mic-diagnosis.js"></script>
  </head>
  <body>
    <main class="screen diagnosis">
      <h1>マイク診断</h1>
      <div id="intro">
        <p>マイクが止まらない方法を、この端末で探します。約5分かかります。</p>
        <ol class="steps">
          <li>消音モード(マナーモード)を解除します。</li>
          <li>下のボタンを押し、マイクの確認が出たら許可します。</li>
          <li><strong>緑</strong>の間は、英語で数を数え続けます(one, two, three…)。</li>
          <li><strong>黄色</strong>の間は、黙ります。</li>
          <li>終わったら、この画面を撮影して送ります。</li>
        </ol>
      </div>
      <button type="button" class="primary" id="start">診断を始める</button>
      <div class="cue" id="cue" hidden></div>
      <table class="results" id="results" hidden></table>
      <p class="report" id="report" hidden></p>
      <button type="button" class="secondary" id="copy" hidden>結果をコピー</button>
      <a class="text-button" href="index.html">アプリへ戻る</a>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
